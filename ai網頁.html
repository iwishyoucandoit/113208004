
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 50% 50%,
                    #26345c 0%,
                    #11182e 35%,
                    #070b17 75%);

            font-family: Arial, "Noto Sans TC", sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: clamp(60px, 10vw, 150px);
            font-weight: 700;
            letter-spacing: 4px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #9ec5ff,
                #ffffff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow:
                0 0 20px rgba(120, 170, 255, 0.4),
                0 0 60px rgba(80, 130, 255, 0.2);

            animation: float 3s ease-in-out infinite;
        }

        p {
            margin-top: 20px;
            font-size: 18px;
            color: #aeb9d6;
            letter-spacing: 3px;
        }

        .line {
            width: 80px;
            height: 2px;
            margin: 25px auto 0;

            background: #8ab4ff;
            box-shadow: 0 0 15px #8ab4ff;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hello World</h1>

        <p>Welcome to my first webpage</p>

        <div class="line"></div>
    </div>

</body>
</html>
